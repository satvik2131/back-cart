services:
  api:
    build: .
    ports:
      - "8000:8000"
    # All settings have working defaults baked in here — no .env file is
    # required. Create one only if you want to override a value; if present,
    # Compose merges it in automatically (docker compose reads ./.env itself).
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-back-cart}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@db:5432/back_cart}
      COUPON_MILESTONE_EVERY: ${COUPON_MILESTONE_EVERY:-5}
      COUPON_DISCOUNT_PERCENT: ${COUPON_DISCOUNT_PERCENT:-10}
    depends_on:
      db:
        condition: service_healthy
    # Mount the whole project for live-reload during development. Code and
    # config edits on the host take effect immediately — no rebuild/restart.
    # (Changing requirements*.txt still needs `docker compose up --build`.)
    volumes:
      - .:/app
    # Apply migrations and seed the catalogue on start, then serve — so a bare
    # `docker compose up --build` yields a working, populated API. Both steps
    # are idempotent.
    command: >
      sh -c "alembic upgrade head &&
             python -m app.features.products.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app"

  # Small React demo UI (Vite dev server), same dev-mode approach as `api`.
  # It reaches the backend over the compose network as `api:8000`
  # (VITE_API_TARGET), so the API still needs no CORS. Source is mounted for
  # live reload; deps come from the image (see frontend/Dockerfile).
  frontend:
    build: ./frontend
    environment:
      VITE_API_TARGET: http://api:8000
      VITE_USE_POLLING: "1"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-back_cart}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-back_cart}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional DB admin UI. NOT part of the default stack — `docker compose up`
  # ignores it. Start it explicitly:
  #   docker compose --profile tools up -d pgadmin   (or: make pgadmin)
  # then open http://localhost:5051 — desktop mode, no pgAdmin login (if a login
  # screen appears, use admin@example.com / admin). The "back-cart" server is
  # pre-registered; enter DB password `postgres` on first connect.
  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5051:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro

volumes:
  postgres_data:
  pgadmin_data:
